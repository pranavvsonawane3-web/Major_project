<script>
  function handleAuth(provider) {
    const ssoBtn = document.getElementById('sso-btn');
    const ssoText = document.getElementById('sso-text');
    if (ssoText) ssoText.textContent = `Authenticating with ${provider}...`;
    Devora.toast(`Authenticating via ${provider}...`, 'info');
    
    localStorage.setItem('devora_auth_user', JSON.stringify({
      name: "Alex Chen",
      role: "Senior DevOps Engineer",
      email: "alex.chen@systemcore.dev",
      provider: provider,
      loginTime: new Date().toISOString()
    }));
    
    setTimeout(() => {
      Devora.toast(`Welcome back, Alex Chen!`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 400);
    }, 600);
  }

  document.getElementById('sso-btn')?.addEventListener('click', () => handleAuth('Enterprise SSO'));
  document.getElementById('github-btn')?.addEventListener('click', () => handleAuth('GitHub'));
  document.getElementById('bitbucket-btn')?.addEventListener('click', () => handleAuth('Bitbucket'));
  document.getElementById('demo-login-btn')?.addEventListener('click', () => handleAuth('Demo Account'));
</script>
